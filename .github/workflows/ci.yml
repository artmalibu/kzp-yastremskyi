name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Verify on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\mvnw.cmd -B clean verify

      - name: Verify on Unix
        if: ${{ runner.os != 'Windows' }}
        run: ./mvnw -B clean verify

      - name: Upload Build Artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar